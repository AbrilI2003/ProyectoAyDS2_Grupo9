spring.application.name=ProyectoAyDS_Grupo9
spring.datasource.url=jdbc:mysql://localhost:3306/verdegreen_grupo9
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración SMTP (sin credenciales: se cargan desde application-local.properties)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Importa el archivo local con las credenciales (NO se sube al repositorio)
spring.config.import=optional:file:./application-local.properties
